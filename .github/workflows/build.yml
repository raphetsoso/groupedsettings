name: Build GroupedSettings (rootless, arm64e)

# Compilation sur macOS : seul moyen d'obtenir l'ABI arm64e "new" attendue par
# iOS 15+ (la toolchain Linux/WSL produit une ABI incompatible).
on:
  workflow_dispatch:
    inputs:
      layers:
        description: "GS_LAYERS (0=canari, 1=A, 3=A+B, 7=A+B+C, 23=+en-tetes, 31=tout)"
        default: "1"
  push:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install make xz ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build (rootless)
        run: |
          gmake clean package THEOS_PACKAGE_SCHEME=rootless GS_LAYERS=${{ github.event.inputs.layers || '1' }}

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: GroupedSettings-deb
          path: packages/*.deb
