name: Build GroupedSettings17 (rootless, arm64 + arm64e)

# Built on macOS: the only way to get the "new" arm64e ABI expected by iOS 15+
# (the Linux/WSL toolchain produces an incompatible ABI).
# Both arm64 (A7-A11, e.g. iPhone 6S) and arm64e (A12+) slices are built.
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install make xz ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build (rootless)
        run: gmake clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: GroupedSettings17-deb
          path: packages/*.deb
